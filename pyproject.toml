[project]
name = "terraform-security-analyzer"
version = "0.1.0"
description = "Production-ready Terraform Security Analyzer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-hcl2>=8.1.2",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
tfscan = "terraform_security_analyzer.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
